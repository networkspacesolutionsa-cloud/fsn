<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light by default; stops mobile browsers (Chrome Android, MIUI) from auto-darkening it.
         The header toggle switches to the site's own dark theme (html.dark sets color-scheme: dark). -->
    <meta name="color-scheme" content="only light" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash
      try {
        if (localStorage.getItem('fsn-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0b1a30" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>FSN | فضاء الشبكات</title>
    <meta name="description" content="حلول احترافية للشبكات والأنظمة الأمنية للمنازل والشركات والمنشآت - كاميرات المراقبة، تمديد وصيانة الشبكات، وأنظمة الإنتركوم." />
    <meta property="og:title" content="FSN | فضاء الشبكات" />
    <meta property="og:description" content="حلول احترافية للشبكات والأنظمة الأمنية للمنازل والشركات والمنشآت - كاميرات المراقبة، تمديد وصيانة الشبكات، وأنظمة الإنتركوم." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
